<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Panel | Cyrca</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../img/logo-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=1">
  <link rel="stylesheet" href="css/portal.css?v=8">
</head>
<body>

  <div class="portal-layout">
    <aside class="portal-sidebar">
      <a href="panel.html" class="logo">
        <img src="../img/logo-icon.png" alt="" class="logo-icon">
        <img src="../img/logo-wordmark.png" alt="Cyrca" class="logo-wordmark">
      </a>
      <ul class="portal-nav">
        <li><a href="panel.html" class="active">Dashboard</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="add-job.html">Add a Job</a></li>
        <li><a href="factura.html">Create Invoice</a></li>
      </ul>
      <div class="portal-sidebar-footer">
        <span id="userEmailDisplay" class="portal-user-email"></span>
        <button id="logoutBtn" class="portal-logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="portal-content">
      <h1>Dashboard</h1>

      <section class="dashboard-intro">
        <div class="dashboard-intro-text">
          <p id="dashboardGreeting" class="dashboard-greeting">Hello!</p>
          <img
            class="dashboard-photo"
            src="https://images.pexels.com/photos/9230462/pexels-photo-9230462.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=400"
            alt="Cleaning supplies"
          >
        </div>
        <blockquote id="dashboardQuote" class="dashboard-quote"></blockquote>
      </section>

      <section class="kpi-grid" id="kpiGrid">
        <p class="note">Loading stats...</p>
      </section>

      <section class="portal-card">
        <h2>Upcoming &amp; Past Jobs</h2>
        <div id="jobsList">
          <p class="note">Loading...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
