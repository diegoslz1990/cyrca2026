<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Cyrca</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../img/logo-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=1">
  <link rel="stylesheet" href="css/portal.css?v=9">
</head>
<body>

  <div class="portal-layout">
    <aside class="portal-sidebar">
      <a href="panel.html" class="logo">
        <img src="../img/logo-icon.png" alt="" class="logo-icon">
        <img src="../img/logo-wordmark.png" alt="Cyrca" class="logo-wordmark">
      </a>
      <ul class="portal-nav">
        <li><a href="panel.html">Dashboard</a></li>
        <li><a href="calendar.html" class="active">Calendar</a></li>
        <li><a href="add-job.html">Add a Job</a></li>
        <li><a href="factura.html">Create Invoice</a></li>
      </ul>
      <div class="portal-sidebar-footer">
        <span id="userEmailDisplay" class="portal-user-email"></span>
        <button id="logoutBtn" class="portal-logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="portal-content">
      <h1>Calendar</h1>

      <section class="portal-card calendar-card">
        <div class="calendar-header">
          <button type="button" id="calendarPrevBtn" class="calendar-nav-btn" aria-label="Previous month">&#8592;</button>
          <h2 id="calendarMonthLabel"></h2>
          <button type="button" id="calendarNextBtn" class="calendar-nav-btn" aria-label="Next month">&#8594;</button>
        </div>

        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section class="portal-card">
        <h2 id="calendarDayTitle">Jobs</h2>
        <div id="calendarDayJobs">
          <p class="note">Click a day on the calendar to see its jobs.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
